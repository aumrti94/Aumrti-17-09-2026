name: QA E2E

# Runs the Playwright QA suite. Deliberately NON-BLOCKING to start with:
# Phase 1 has not been walked manually yet, so failures here are expected until
# the phase is green. Remove `continue-on-error` and add this job as a required
# check once docs/qa/tracker Summary shows Phase 01 = PASSED.
#
# The suite will not touch the database unless QA_ALLOW_PROJECT_REF matches the
# target project — see e2e/global-setup.ts and .env.example.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'      # 01:30 IST nightly
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'supabase/migrations/**'
      - 'playwright.config.ts'

jobs:
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true          # <- remove once Phase 1 is green
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}

      - name: Run Phase 1 suite
        run: npm run qa:phase1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          SUPABASE_TEST_URL: ${{ secrets.QA_SUPABASE_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
          # Without this the suite skips every database assertion rather than
          # risking a run against production.
          QA_ALLOW_PROJECT_REF: ${{ secrets.QA_ALLOW_PROJECT_REF }}
          QA_SEEDING_CONFIRMED: ${{ secrets.QA_SEEDING_CONFIRMED }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
